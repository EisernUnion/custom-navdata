name: Build Windows application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - name: Build installer and update packages
        run: npm run make
      - uses: actions/upload-artifact@v7
        with:
          name: BAVirtual-Custom-Nav-Data-Windows-x64
          path: out/make/squirrel.windows/x64/*
          if-no-files-found: error
          retention-days: 14
